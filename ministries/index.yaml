content:
  - title: Gateway Kids
    description: >-
      At Gateway Kids, we are passionate about training up the next generation
      to lead, love, and serve Jesus! We strive to come alongside parents to
      help disciple their children at home while pointing them to Jesus whenever
      they are here.


      Sunday Morning Schedule


      We offer two opportunities for your kids to grow in their faith every
      Sunday morning:

      • Sunday School (9:00 AM – 10:00 AM): Age-specific classes focused on
      foundational Bible learning, crafts, games, and fellowship.

      • Kids Church (10:30 AM - 12:00 PM): An engaging, Gospel-centered
      environment where your child will experience God’s Word through worship,
      games, and crafts.

      It is our desire for every child to understand the good news of Jesus from
      a young age!


      Safety & Check-In


      We take the safety of your kids seriously. Every member serving in Gateway
      Kids has completed a thorough background check and Ministry Safe Training.
      If you are visiting for the first time, we would love for you to arrive a
      few minutes early to get your children checked in, see their classrooms,
      and meet their teachers!
  - title: GTWY YTH
    description: >-
      Gateway Students exists to reach the next generation with the gospel and
      help students grow into lifelong followers of Jesus. Our heart is to see
      lives transformed in a way that impacts our community, our schools, and
      the nations. We desire to come alongside parents as we raise up disciples
      who love Jesus and love people.


      There are several opportunities throughout the week for students to
      connect, grow, and have fun!


      Sunday Mornings | 9:00 AM - 10:00 AM ·  Sunday School: Students gather to
      study God's Word, grow in their faith, and learn what it means to follow
      Jesus.

      Sunday Evenings | 4:00 PM - 6:00 PM · Youth Group: Middle and High School
      students come together for games, hanging out, and fellowship, followed by
      diving deeper into God's Word in small groups and building meaningful
      relationships with one another.

      Wednesday Evenings | 4:00 PM - 6:00 PM ·  A relaxed, informal time for
      students to come hang out, connect, and spend time together. Whether they
      need a place to work on homework, enjoy some study hall time, play games,
      or simply fellowship with friends, there's room for both!


      We'd love for your student to be part of what God is doing through Gateway
      Students. They have a place here!
  - title: Men's Ministry
    description: >-
      We want to raise up men of all ages who lead their families, love others,
      and invest in the next generation to follow Jesus. 


      Gateway Men meet on the last Saturday morning each month from 8-9am for
      breakfast, fellowship, and some encouraging teaching. 


      Iron sharpens iron, and one man sharpens another. Proverbs 27:17
  - title: Women's Ministry
    description: >-
      Our Women's Ministry is passionate about biblical womanhood and walking
      alongside women from all backgrounds and stages of life. Whether you are a
      college student, a busy mom, an empty nester, or brand new to the faith,
      there is a place for you here. We strive to teach women how to read their
      Bibles in a way that stirs their affections for Christ and overflows into
      every area of life—home, church, work, and relationships.

      Alongside our weekly Bible studies, we regularly gather for fun activities
      and events designed to help you relax, fellowship, and build genuine,
      lasting friendships.

      Contact the front office for more information on study times, locations,
      and upcoming events.


      "Strength and dignity are her clothing, and she laughs at the time to
      come. She opens her mouth with wisdom, and the teaching of kindness is on
      her tongue." — Proverbs 31:25–26
  - title: Gateway Groups
    description: >-
      Gateway Groups meet on weeknights in homes throughout the East Valley and
      are focused on building genuine community. We believe Gateway Groups are
      built on a three-legged stool: praying and applying Scripture, practicing
      truth in love through fellowship, and personal evangelism.


      Gateway Groups offer something you can’t get from simply sitting in rows
      and listening to one person teach or preach. Instead, we circle up in a
      family room or gather around a dining room table, creating space for
      relationships to be cultivated, love to be demonstrated, truth to be
      spoken, and people to grow.


      We encourage you to choose a group based on three factors: schedule,
      geography, and connection. Find a group that meets on a night you’re
      typically available, is close to your home, and includes people you have a
      connection with. Connection is the least important of these three, because
      we believe there is value in building relationships with other
      Christians—even people you may not know yet.


      Some groups offer childcare
